
name: ChatGPT User Satisfaction ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Train the ChatGPT satisfaction model
      - name: Train ChatGPT satisfaction model
        run: python train_model.py

      # 6. Check ML quality gate
      - name: Check ML quality gate
        run: python quality_gate.py

      # 7. Run ML pipeline tests
      - name: Run ChatGPT satisfaction ML tests
        run: python -m unittest -v test_ml_pipeline

      # 8. Run prediction application tests
      - name: Run prediction application tests
        run: python -m unittest -v test_app

      # 9. Prepare release candidate
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate/artifacts

          cp app.py release_candidate/
          cp artifacts/chatgpt_satisfaction_pipeline.joblib release_candidate/artifacts/
          cp outputs/metrics.json release_candidate/metrics.json
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          printf '%s\n' \
            'ChatGPT User Satisfaction ML Application' \
            'Install dependencies: pip install -r requirements.txt' \
            'Start application: python app.py' \
            'Health endpoint: GET /' \
            'Prediction endpoint: POST /predict' \
            > release_candidate/DEPLOYMENT.txt

      # 10. Upload release candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-satisfaction-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      # 11. Preserve trained model and ML artifacts
      - name: Preserve ChatGPT satisfaction ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-satisfaction-artifacts
          path: |
            artifacts/chatgpt_satisfaction_pipeline.joblib
            outputs/metrics.json
            outputs/chatgpt-users.csv
          if-no-files-found: error
          retention-days: 7

      # 12. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t chatgpt-satisfaction-ml:${{ github.sha }} .

      # 13. Start Docker container
      - name: Start Docker container
        run: |
          docker run -d \
            --name chatgpt-satisfaction-container \
            -p 5000:5000 \
            chatgpt-satisfaction-ml:${{ github.sha }}

      # 14. Wait for application and check health endpoint
      - name: Check application health
        run: |
          for i in {1..15}; do
            if curl --fail --silent --show-error \
              http://localhost:5000/; then
              echo ""
              echo "Application health check passed."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application health check failed."
          exit 1

      # 15. Test prediction endpoint
      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Age": 25,
              "Country": "India",
              "Plan": "Plus",
              "Primary_Use_Case": "Learning",
              "Device": "Android",
              "Sessions": 20,
              "Avg_Session_Minutes": 15,
              "Messages_Sent": 100,
              "Files_Uploaded": 2,
              "Images_Generated": 1,
              "Favorite_Model": "GPT-4",
              "Monthly_Spend_USD": 20,
              "Notifications_Enabled": true,
              "Dark_Mode": true
            }' \
            http://localhost:5000/predict)

          echo "Prediction response:"
          echo "$response"

          echo "$response" | python -c '
          import json
          import sys

          result = json.load(sys.stdin)

          if "prediction" not in result:
              raise SystemExit(
                  "FAIL: prediction key is missing from the response"
              )

          print("Prediction endpoint test passed.")
          '

      # 16. Display Docker logs, even if an earlier step fails
      - name: Show Docker container logs
        if: always()
        run: |
          docker logs chatgpt-satisfaction-container || true

      # 17. Stop and remove container, even after failure
      - name: Stop and remove Docker container
        if: always()
        run: |
          docker rm -f chatgpt-satisfaction-container || true
