
name: ChatGPT User Satisfaction ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train ChatGPT satisfaction model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run ChatGPT satisfaction ML tests
        run: python -m unittest -v test_ml_pipeline

      - name: Preserve ChatGPT satisfaction ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-satisfaction-artifacts
          path: |
            artifacts/chatgpt_satisfaction_pipeline.joblib
            outputs/metrics.json
            outputs/chatgpt-users.csv
          if-no-files-found: error
          retention-days: 7
