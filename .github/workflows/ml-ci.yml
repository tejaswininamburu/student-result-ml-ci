name: ChatGPT Users ML CI-CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Quality Gate
        run: python quality_gate.py

      - name: Run ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction app tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp artifacts/model.joblib release_candidate/
          cp artifacts/metrics.json release_candidate/
          cp requirements.txt release_candidate/
          echo "ChatGPT Users ML App" > release_candidate/DEPLOYMENT.txt
          echo "Run: python app.py" >> release_candidate/DEPLOYMENT.txt
          echo "Endpoint: POST /predict" >> release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-users-ml-release
          path: release_candidate/
          if-no-files-found: error
